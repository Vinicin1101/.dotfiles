# Sourcing colors generated by wallust
source = $HOME/.config/hypr/wallust/wallust-hyprland.conf

# BACKGROUND
background {
    monitor =
    path = screenshot
    blur_size = 2
    blur_passes = 3
    noise = 0.05
    contrast = 1.0
    brightness = 0.1
    vibrancy = 0.5
    vibrancy_darkness = 1.0
}

# INPUT
input-field {
    monitor =
    size = 250, 30
    outline_thickness = 2
    dots_size = 0.35
    dots_spacing = 0.25
    dots_center = true
    outer_color = $color5
    inner_color = $color0
    font_color = $color12
    font_family = JetBrains Mono Nerd Font 12
    placeholder_text = <i>Password...</i>
    hide_input = false 
    position = 0, -25
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date '+%A, %d %B')</span>"
    color = $color14
    font_size = 15
    font_family = JetBrains Mono Nerd Font 12
    position = 0, -200
    halign = center
    valign = top
}

# TIME
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $color9
    font_size = 60
    font_family = JetBrains Mono Nerd Font 12
    position = 0, -100
    halign = center
    valign = top 
}

# USERNAME
label {
    monitor =
    text = cmd[update:60000] echo "Hello, <u>$USER</u>"
    color = $color14
    font_size = 15
    font_family = JetBrains Mono Nerd Font 12
    position = 0, 30
    halign = center
    valign = center
}

# PROFILE PHOTO
image {
    monitor =
    path = $HOME/Pictures/profile/chef.png
    border_size = 0
    size = 100
    rounding = -1	# circle
    rotate = 0
    reload_time = -1
    reload_cmd =
    position = 0, 100
    halign = center
    valign = center
}


# SONG DETAILS
label {
    monitor =
    text = cmd[update:1000] echo "$(~/.config/hypr/scripts/sound/playerlock.sh -metadata)"
    color = $color14
    font_size = 10
    font_family = JetBrains Mono Nerd, SF Pro Display Bold
    position = 0, 50
    halign = center
    valign = bottom
}

# UPTIME
label {
    monitor =
    text = cmd[update:60000] echo "<b> "$(uptime -p)" </b>"
    color = $color0
    font_size = 10
    font_family = JetBrains Mono Nerd Font 12
    position = 0, 10
    halign = center
    valign = bottom
}

