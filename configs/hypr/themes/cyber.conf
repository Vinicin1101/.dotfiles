# User Configs
$UserConfigs = $HOME/.config/hypr/userConfigs

source= $UserConfigs/startup.conf
source= $UserConfigs/rules.conf
source= $UserConfigs/binds.conf
source= $UserConfigs/env.conf

source = $HOME/.config/hypr/wallust/wallust-hyprland.conf
monitor=, 1920x1080@75,auto,auto, vrr, 1

general {
    gaps_in = 0
    gaps_out = 1
    border_size = 1
    col.active_border = $color4
    col.inactive_border = $color8

    layout = dwindle
}

decoration {
    rounding = 0
    fullscreen_opacity = 1
    layerrule = blur,waybar
    
    blur {
        enabled = true
        size = 4
        passes = 3
	ignore_opacity = true
	xray = false
	new_optimizations = true
    }
}

animations {
    enabled = no
}

dwindle {
    pseudotile = yes
    preserve_split = yes
}

gestures {
    workspace_swipe = on
}

input {
    kb_layout = br
    follow_mouse = 1
    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
}
