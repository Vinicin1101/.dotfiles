top_text = "Power Menu";
bottom_text = "";
border_width = 2;
columns = 3;
column_gap = 5;
row_gap = 5;

size= {
    width = 320;
    height = 160;
};

shutdown: {
    label = "⏻";
    action = "systemctl poweroff";
    bind = 115;     // 's'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
    description = "Shutdown";
};

reboot: {
    label = "";
    action = "systemctl reboot";
    bind = 114;     // 'r'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
    description = "Reboot";
};

logout: {
    label = "󰗽";
    action = "hyprctl dispatch exit";
    bind = 108;     // 'l'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
    description = "Logout";
};

hibernate: {
    label = "󰤄";
    action = "systemctl hibernate";
    bind = 104;     // 'h'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
    description = "Hibernate";
};

suspend: {
    label = "󰒲";
    action = "systemctl suspend";
    bind = 117;     // 'u'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
    description = "Suspend";
};  

lock: {
    title = ""
    label = "";
    action = "hyprlock";
    bind = 107;     // 'k'
    image = "";
    img_size = {
        width = 32;
        height = 32;
    };
